name: Doomsday Ticket Checker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: "Send Telegram status even if no new theatres opened"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: doomsday-ticket-bot
  cancel-in-progress: false

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Patchright Chrome and Xvfb
        run: |
          python -m patchright install chrome
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run ticket checker
        env:
          CI: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_alert || 'false' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python check_tickets.py

      - name: Save alert state
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update alerted ticket state [skip ci]"
              git push
            fi
          fi
